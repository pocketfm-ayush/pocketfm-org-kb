# Maps org.yaml / handbook repository ids → local pack folders in this repo.
version: 1
content_knowledge_base:
  github: https://github.com/Pocket-Fm/content-knowledge-base.git
  local_path_env: PFM_CKB_PATH
  default_local_path: ../content-knowledge-base
  mirrored_under: packs/

mappings:
  radioly_client_api:
    pack: radioly
    contract: packs/radioly/knowledge-base/CONTRACT.md
  android_client:
    pack: android-client
    contract: packs/android-client/knowledge-base/CONTRACT.md
  ios_client:
    pack: ios-client
    contract: packs/ios-client/knowledge-base/CONTRACT.md
  kafka-stream-clients:
    pack: kafka-stream-clients
    contract: packs/kafka-stream-clients/knowledge-base/CONTRACT.md
  airflow:
    pack: airflow
    contract: packs/airflow/knowledge-base/CONTRACT.md
  fabric:
    pack: fabric
    contract: packs/fabric/knowledge-base/CONTRACT.md
  impression:
    pack: fabric
    contract: packs/fabric/knowledge-base/CONTRACT.md
  content-backend:
    pack: content-backend
    contract: packs/content-backend/knowledge-base/CONTRACT.md
  go-radioly:
    pack: go-radioly-service
    contract: packs/go-radioly-service/knowledge-base/CONTRACT.md
  pocket_search:
    pack: search
    contract: packs/search/knowledge-base/CONTRACT.md
  litefm-backend:
    pack: litefm-backend
    contract: packs/litefm-backend/knowledge-base/CONTRACT.md
  experience:
    pack: airflow
    contract: packs/airflow/knowledge-base/CONTRACT.md
  ads:
    pack: airflow
    contract: packs/airflow/knowledge-base/CONTRACT.md

# Handbook-ready repos without a dedicated Groot pack folder
unmapped_ok:
  - iam
  - nexus
  - go-common
  - python-common
  - apollo
  - raven
  - writers-backend
  - cms-dashboard-backend
  - prod_novels_cron_airflow
  - novels-kafka-stream-client
  - writers_payout_airflow
  - infra-deployments-k8s
  - infra-k8s
  - infra-docs
  - groot
  - media-forge
  - ugc-backend
  - ugc-ui
  - ugc-tts-worker
