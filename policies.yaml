api_version: org-brain/v1
default_profile: repository_read
profiles:
  metadata_only:
    can_read_source: false
    can_read_ops: false
    can_read_schema: false
    can_write: false
  repository_read:
    can_read_source: true
    can_read_ops: false
    can_read_schema: false
    can_write: false
  operational_read:
    can_read_source: true
    can_read_ops: true
    can_read_schema: false
    can_write: false
  schema_read:
    can_read_source: true
    can_read_ops: false
    can_read_schema: true
    can_write: false
  action_capable:
    can_read_source: true
    can_read_ops: true
    can_read_schema: true
    can_write: true

# Pocket FM defaults: agents query as repository_read unless explicitly elevated.
principals:
  groot_slack:
    profile: repository_read
  groot_deep_agent:
    profile: repository_read
  cursor_local:
    profile: schema_read
  human_oncall:
    profile: operational_read
