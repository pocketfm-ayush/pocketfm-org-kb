  documentation:
    enabled: true
    path: ./memory
  issue_tracker:
    enabled: true
    path: ./memory/incidents
  observability:
    enabled: false
    notes: Phase 7 — enable otel.http / Sherlock when approved

  knowledge_peers:
    content_knowledge_base:
      github: https://github.com/Pocket-Fm/content-knowledge-base.git
      local_path: ../content-knowledge-base
      role: groot_packs_upstream
      mirrored_in: ./packs
    cerebro_knowledge:
      local_path: ../cerebro-knowledge
      role: cross_repo_semantics
      mirrored_resources: ./peers/cerebro/resources

connectors:
  mcp:
    enabled: false
    allowlist: []

indexing:
  include:
    - "**/*.py"
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.go"
    - "**/*.kt"
    - "**/*.kts"
    - "**/*.swift"
    - "**/*.sql"
    - "**/*.yaml"
    - "**/*.yml"
    - "**/*.md"
    - "**/*.json"
  exclude:
    - "**/node_modules/**"
    - "**/.git/**"
    - "**/vendor/**"
    - "**/dist/**"
    - "**/build/**"
    - "**/*lock*"
    - "**/generated/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/*.pb.go"
    - "**/secrets/**"
    - "**/.env*"

security:
  tenant_isolation: required
  redact_secrets: true
  enforce_source_permissions: true
  allow_destructive_actions: false

query:
  max_graph_depth: 3
  max_nodes: 50
  token_budget: 8000
